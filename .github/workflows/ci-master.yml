name: CI post-merge

# Downstream fork contract: the post-merge lane validates a merged tree on a
# standard GitHub-hosted runner. Upstream's master-only self-hosted standby
# drills and larger-runner benchmarks are not part of this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Unlike upstream's master workflow there is no self-hosted drill whose runtime
# must survive a superseding merge, so every run cancels its superseded
# predecessor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Main seeds the Wine apt-archive cache in the default-branch scope, which
  # every pull request's windows job can restore; saves from pull-request runs
  # are scoped to their own merge ref and help nobody else. Runs in seconds when
  # the image version already has a cache.
  wine-apt-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: wine apt cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compose Wine apt cache key
        id: wine-cache-key
        run: echo "key=wine-debs-${ImageOS:-linux}-${ImageVersion:-v0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: wine-cache
        with:
          path: ~/wine-debs
          key: ${{ steps.wine-cache-key.outputs.key }}

      - name: Download the Wine dependency closure
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only wine
          mkdir -p "$HOME/wine-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/wine-debs/"
          du -sh "$HOME/wine-debs"

  # The pull-request lane already ran the exhaustive gates; this lane proves the
  # merge result itself still installs, builds, unit-tests, and passes the
  # static gates on a standard runner. `github.event.before` is the previous
  # default-branch head, which is the merge base the archive gate compares
  # against — the push-side analogue of a pull request's base sha.
  post-merge:
    name: post-merge / build, unit tests, static gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # The pull-request lanes are restore-only by design, so this
      # default-branch lane is the writer of the caches they read; without it
      # every pull request installs and downloads cold.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The browser binary is the expensive half of the consumer lane's
      # Playwright setup; its apt dependencies stay per-run.
      - name: Seed the Playwright Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vreal/dsh-web-frontend exec playwright install chromium

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before }}
        run: pnpm run check:ci:static

      - name: Save pnpm store
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Save Playwright browser cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
