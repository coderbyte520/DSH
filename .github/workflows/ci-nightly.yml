name: CI nightly

# The complete native Windows inventory is this repository's most expensive lane
# — 36.5 minutes on a standard Windows runner, billed at twice the Linux rate —
# and its failures so far have been the same classes the Linux lanes already
# report. Pull requests keep the blocking Windows subset (`windows node 24 /
# wine blocking` in ci.yml); this nightly lane owns the full inventory so a
# Windows-only regression still surfaces within a day. Dispatch it manually
# after a risky Windows-touching change instead of waiting for the schedule.

on:
  schedule:
    # 18:17 UTC = 02:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 18 * * *'
  workflow_dispatch:

# A nightly snapshot never displaces another one; a manual dispatch may replace
# its own superseded predecessor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-native:
    name: windows node 24 / native complete
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_COVERAGE_MAX_WORKERS: '6'
      DSH_COVERAGE_PARTITIONS: '8'
      # Instrumented process and polling fixtures can exceed Vitest's defaults
      # under the complete lane's concurrent gate load.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '30000'
      DSH_GATE_CONCURRENCY: '4'
      DSH_PUBLINT_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Extracting the many-file pnpm store cache is slower than a clean install
      # on hosted Windows runners, and saving it would add latency after the
      # gates, so this lane installs fresh and saves nothing.
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run complete native Windows gate inventory
        shell: pwsh
        run: pnpm run check:ci:windows-complete
