name: Snapshot diagnose

# Manual diagnostic: reproduce the keyless snapshot lanes on Linux, rewrite the
# expected outputs from the current tree, and upload the resulting diff. The
# snapshot fixtures must replay on macOS/Linux, so a divergence these lanes
# report in CI cannot be inspected from a Windows checkout; this job turns the
# truncated CI assertion bodies into a reviewable patch without touching the
# pull request's own branch.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  snapshot-diff:
    name: snapshot diff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Each lane first reports its divergence (the assertion bodies CI
      # truncates), then rewrites the expected outputs from this tree.
      - name: Replay the keyless snapshot lane
        continue-on-error: true
        run: pnpm run test:snapshot

      - name: Refresh the keyless snapshot fixtures
        continue-on-error: true
        run: pnpm run test:snapshot:refresh

      - name: Install Playwright Chromium
        run: pnpm --filter @vreal/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Replay the web snapshot lane
        continue-on-error: true
        run: pnpm run test:web:ci

      - name: Refresh the web snapshot fixtures
        continue-on-error: true
        run: pnpm run test:web:refresh

      - name: Capture the diff
        run: |
          git diff --stat > snapshot-diff.stat.txt
          git diff > snapshot-diff.patch
          cat snapshot-diff.stat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff
          path: |
            snapshot-diff.stat.txt
            snapshot-diff.patch
