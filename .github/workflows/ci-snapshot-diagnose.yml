name: Snapshot diagnose

# Manual diagnostic: reproduce the keyless snapshot lanes on Linux, rewrite the
# expected outputs from the current tree, and upload the resulting diff. The
# snapshot fixtures must replay on macOS/Linux, so a divergence these lanes
# report in CI cannot be inspected from a Windows checkout; this job turns the
# truncated CI assertion bodies into a reviewable patch without touching the
# pull request's own branch.

# `workflow_dispatch` only reaches workflows that exist on the default branch,
# so until this file lands there the push trigger is how a feature branch runs
# it: touch this file to request a diagnostic. The paths filter keeps an
# ordinary push from starting a 60-minute lane.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci-snapshot-diagnose.yml

permissions:
  contents: read

env:
  # The snapshot gate runs examples from built artifacts under plain Node.
  DSH_EXAMPLE_MODE: 'lib'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  snapshot-diff:
    name: snapshot diff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The consumer lane prepares bubblewrap before its snapshot gates; without
      # it the examples refuse workspace-write and refresh would record sandbox
      # failures instead of the behaviour under test.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Each lane first reports its divergence (the assertion bodies CI
      # truncates), then rewrites the expected outputs from this tree.
      - name: Replay the keyless snapshot lane
        continue-on-error: true
        run: pnpm run test:snapshot

      - name: Refresh the keyless snapshot fixtures
        continue-on-error: true
        run: pnpm run test:snapshot:refresh

      - name: Install Playwright Chromium
        run: pnpm --filter @vreal/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Replay the web snapshot lane
        continue-on-error: true
        run: pnpm run test:web:ci

      - name: Refresh the web snapshot fixtures
        continue-on-error: true
        run: pnpm run test:web:refresh

      - name: Capture the diff
        run: |
          git diff --stat > snapshot-diff.stat.txt
          git diff > snapshot-diff.patch
          cat snapshot-diff.stat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff
          path: |
            snapshot-diff.stat.txt
            snapshot-diff.patch
