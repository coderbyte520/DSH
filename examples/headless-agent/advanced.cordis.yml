# Add Code Mode and Cordis tools to the headless spawn/workflow stack.
- id: base
  name: '@vreal/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: agent-spine
        name: '@vreal/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-pro
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: persistence
        name: '@vreal/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
      - insert:
          - id: code-runtime
            name: '@vreal/dsh-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@vreal/dsh-cordis-host-runner'
          - id: tool-cordis
            name: '@vreal/dsh-tool-cordis'
